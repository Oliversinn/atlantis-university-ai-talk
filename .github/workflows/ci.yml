name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.2.1
          poetry --version

      - name: Install dependencies
        run: poetry install --with dev --no-root

      - name: Lint
        run: poetry run ruff check . && poetry run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.2.1
          poetry --version

      - name: Install dependencies
        run: poetry install --with dev --no-root

      - name: Typecheck
        run: poetry run mypy src/

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.2.1
          poetry --version

      - name: Install dependencies
        run: poetry install --with dev --no-root

      - name: Test
        run: poetry run pytest
