[project]
name = "f1-ai-app"
version = "0.1.0"
description = "Formula 1 Q&A App powered by AI"
authors = [
    {name = "Oliversinn"}
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.32.0",
    "fastf1>=3.3.0",
    "openai>=1.14.0",
    "plotly>=5.19.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/f1_ai --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/f1_ai"]
omit = ["src/f1_ai/__init__.py", "src/f1_ai/viz/__init__.py", "src/f1_ai/data/__init__.py", "src/f1_ai/ai/__init__.py"]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
