[project]
name = "f1-ai-app"
version = "0.1.0"
description = "Formula 1 Q&A App powered by AI"
authors = [
    {name = "Oliversinn"}
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.32.0",
    "fastf1>=3.3.0",
    "openai>=1.14.0",
    "plotly>=5.19.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
